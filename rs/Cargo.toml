[package]
name = "watklok-native"
version = "0.1.0"
edition = "2024"

[lib]
# Это критически важно: сообщаем Rust, что собираем динамическую библиотеку C-типа
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.9.0", default-features = true }
napi-derive = "3.5.6"
once_cell = "1.21.4"
rand = "0.10.1"
dashmap = "7.0.0-rc2"
arc-swap = "1.9.1"

# For OGGParser
bytes = "1.11.1"
memchr = "2.8.1"

# For crypto
davey = "0.1.3"
aead = "0.6.0-rc.10"
aes-gcm = { version = "0.11.0-rc.4", features = ["aes"] }

# Профиль релиза (лучшая оптимизация)
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"