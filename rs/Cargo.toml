[package]
name = "watklok-native"
version = "0.1.0"
edition = "2024"

[lib]
# Это критически важно: сообщаем Rust, что собираем динамическую библиотеку C-типа
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.9.0", default-features = false, features = ["napi9", "async", "serde-json"] }
napi-derive = "3.5.6"
once_cell = "1.21.4"
rand = "0.10.1"
dashmap = "7.0.0-rc2"
aes-gcm = "0.11.0-rc.3"
memchr = "2.8.0"
arc-swap = "1.9.1"
davey = "0.1.3"
libc = "0.2.186"

# Профиль релиза (лучшая оптимизация)
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"