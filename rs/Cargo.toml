[package]
name = "watklok-native"
version = "0.1.0"
edition = "2024"

[lib]
# Это критически важно: сообщаем Rust, что собираем динамическую библиотеку C-типа
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.9.4", default-features = true }
napi-derive = "3.5.7"
once_cell = "1.21.4"
rand = "0.10.1"
dashmap = "7.0.0-rc2"
arc-swap = "1.9.1"

# For OGGParser
bytes = "1.12.0"
memchr = "2.8.2"

# For crypto
davey = "0.1.4"
aead = "0.6.1"
aes-gcm = { version = "0.11.0-rc.4", features = ["aes"] }
parking_lot = "0.12.5"

# Профиль релиза (лучшая оптимизация)
[profile.release]
opt-level = 3            # Максимальная оптимизация скорости кода (по умолчанию в release)
lto = true               # Включает Link-Time Optimization (оптимизация между всеми крейтами)
codegen-units = 1        # LLVM оптимизирует всё как один блок, улучшая инлайнинг и глобальный анализ
panic = "abort"          # Отключает раскрутку стека при панике (уменьшает размер файла и ускоряет код)
strip = true             # Полностью удаляет отладочные символы и таблицы из бинарника