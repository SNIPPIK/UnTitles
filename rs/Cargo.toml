[package]
name = "watklok-native"
version = "0.1.0"
edition = "2024"
authors = ["SNIPPIK"]

[lib]
crate-type = ["cdylib"]

[target.'cfg(not(target_os = "android"))'.dependencies]
mimalloc = "0.1.52"

[dependencies]
napi = { version = "3.13.0", features = [
    "napi10", "async", "node_version_detect",
    "tokio_rt", "serde-json", "error_anyhow",
] }
napi-derive = "3.6.9"
once_cell = "1.21.4"
arc-swap = "1.9.2"

# For RingBuffer
crossbeam-utils = "0.8.23"

# For OGGParser
bytes = "1.12.1"
memchr = "2.8.3"

# For crypto
davey = "0.1.4"
rand = "0.10.3"
aead = { version = "0.6.1", default-features = false }
aes-gcm = { version = "0.11.1", features = ["aes"] }

# For WebSocket
parking_lot = "0.12.5"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.30", features = [
    "connect",
    "handshake",
    "rustls-tls-webpki-roots"
] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }

# Профиль релиза
[profile.release]
opt-level = 3            # Максимальная оптимизация скорости кода (по умолчанию в release)
lto = true               # Включает Link-Time Optimization (оптимизация между всеми крейтами)
codegen-units = 1        # LLVM оптимизирует всё как один блок, улучшая инлайнинг и глобальный анализ
panic = "abort"          # Отключает раскрутку стека при панике (уменьшает размер файла и ускоряет код)
strip = true             # Полностью удаляет отладочные символы и таблицы из бинарника